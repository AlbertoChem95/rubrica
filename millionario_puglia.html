<style>
:root{
  --bg:#080e1a;--panel:#111a2b;--panel2:#162035;--line:#243350;
  --gold:#facc15;--green:#4ade80;--red:#f87171;--blue:#60a5fa;--purple:#a78bfa;
  --txt:#e8eef7;--mut:#7a90b0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh}
.hd{background:linear-gradient(135deg,#12294d,#0a4070 55%,#092d55);padding:13px 16px;text-align:center;border-bottom:2.5px solid var(--gold);position:sticky;top:0;z-index:30}
.hd h1{font-size:1.18rem;color:var(--gold)}
.hd .sub{font-size:.73rem;color:#90b8e0;margin-top:2px}
.screen{padding:14px;flex:1;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.btn{display:block;width:100%;border:none;border-radius:11px;padding:14px;font-size:.97rem;font-weight:800;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#eaa800);color:#080e1a;box-shadow:0 4px 14px rgba(250,204,21,.22)}
.btn-ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.mt{margin-top:12px}.mt-s{margin-top:7px}
.sec-title{font-size:.97rem;font-weight:800;color:var(--gold);display:flex;align-items:center;gap:7px;margin-bottom:10px}

/* INTRO */
.intro-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}
.intro-cell{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 4px;text-align:center;font-size:.62rem;color:var(--mut)}
.intro-cell .e{font-size:1.25rem;display:block;margin-bottom:3px}
.rules{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px}
.rules li{list-style:none;padding:7px 0;border-bottom:1px solid #1a2740;display:flex;gap:9px;align-items:flex-start;font-size:.86rem;line-height:1.4}
.rules li:last-child{border-bottom:none}
.rules .ic{flex-shrink:0;font-size:1rem}

/* TURN BAR */
.turnbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.yearlbl{font-weight:800;color:var(--gold);font-size:.97rem;white-space:nowrap}
.dots{display:flex;gap:4px}
.dot{width:12px;height:12px;border-radius:50%;background:#1c2e48;border:2px solid #263d60;transition:.25s}
.dot.done{background:var(--green);border-color:#22c55e}
.dot.cur{background:var(--gold);border-color:#eab308;box-shadow:0 0 7px rgba(250,204,21,.55)}

/* STANDINGS */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px}
.pcard.lead{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pcard .nm{font-size:.82rem;font-weight:700}
.pcard .wl{font-size:1.08rem;font-weight:900;color:var(--green);margin-top:2px;font-variant-numeric:tabular-nums}
.pcard .dl{font-size:.68rem;margin-top:1px;font-weight:700}
.dl.up{color:var(--green)}.dl.down{color:var(--red)}.dl.flat{color:var(--mut)}

/* EVENT */
.ev{border-radius:12px;padding:12px 14px;margin-bottom:13px;border:1px solid;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.ev .lb{font-weight:800;font-size:.96rem;display:block;margin-bottom:3px}
.ev .ds{font-size:.81rem;line-height:1.42;opacity:.92}
.ev.good{background:#052212;border-color:#16813e;color:#86efac}
.ev.bad{background:#220808;border-color:#b03030;color:#fca5a5}
.ev.neutral{background:#141820;border-color:#4a5568;color:#b8c4d4}
.ev.info{background:#071830;border-color:#2060b0;color:#90c0f0}

/* CHOICE HEADER */
.choice-hd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.ch-top{display:flex;align-items:center;justify-content:space-between}
.ch-who{font-size:1.1rem;font-weight:900}
.ch-step{font-size:.7rem;color:var(--mut);background:#0b1528;border:1px solid #1e3050;padding:2px 8px;border-radius:20px}
.ch-cash{font-size:.82rem;color:var(--mut);margin-top:5px}
.ch-cash b{color:var(--txt)}
.ch-hint{font-size:.79rem;color:var(--blue);font-weight:700;margin-top:4px}

/* CHOICE CARD */
.ccard{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px;cursor:pointer;transition:.15s;position:relative;-webkit-user-select:none;user-select:none}
.ccard:active{transform:scale(.99)}
.ccard.sel{border-color:var(--gold);background:#181e0a;box-shadow:0 0 0 1px var(--gold) inset}
.ccard .top{display:flex;align-items:flex-start;gap:10px}
.ccard .em{font-size:1.65rem;flex-shrink:0;line-height:1}
.ccard .info{flex:1;min-width:0}
.ccard .cn{font-weight:800;font-size:.89rem}
.ccard .cd{font-size:.72rem;color:var(--mut);margin-top:1px;line-height:1.3}
.ccard .chk{position:absolute;top:9px;right:9px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.72rem;color:#080e1a;font-weight:900;flex-shrink:0}
.ccard.sel .chk{background:var(--gold);border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:.64rem;font-weight:700;padding:2px 7px;border-radius:14px;border:1px solid;white-space:nowrap}
.ch-cost{background:#0b1830;border-color:#243a60;color:#9ab8e0}
.ch-rng{background:#0b1830;border-color:#243a60;color:#c0cde0}
.ch-cat{border-color:#2a3e5a}
.ch-rl{background:#052212;border-color:#16813e;color:#86efac}
.ch-rm{background:#1e1800;border-color:#927000;color:#fcd34d}
.ch-rh{background:#220808;border-color:#b03030;color:#fca5a5}
.ch-fav{background:#052212;border-color:#16813e;color:#86efac}
.ch-unf{background:#220808;border-color:#b03030;color:#fca5a5}

/* RESULTS */
.rrow{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px}
.rrow .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rrow .rn{font-weight:800;font-size:.9rem}
.rrow .rsub{font-size:.7rem;color:var(--mut);margin-top:2px}
.rrow .rg{font-weight:900;font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}
.rg.pos{color:var(--green)}.rg.neg{color:var(--red)}

/* FINAL */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:7px;margin:8px 0 16px}
.pp{flex:1;max-width:115px;text-align:center;border-radius:11px 11px 0 0;padding:10px 5px;border:2px solid;border-bottom:none}
.pp .pe{font-size:1.5rem}
.pp .pn{font-weight:800;font-size:.82rem;margin:3px 0 1px}
.pp .pw{font-size:.76rem;font-weight:900;color:var(--green);font-variant-numeric:tabular-nums}
.pp.first{background:#221c00;border-color:var(--gold);height:132px;order:2}
.pp.second{background:#161c28;border-color:#8a96a8;height:108px;order:1}
.pp.third{background:#1e1000;border-color:#b07000;height:90px;order:3}
.frow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:7px;display:flex;align-items:center;gap:9px}
.frow .rk{font-weight:900;color:var(--gold);width:20px;font-size:.97rem}
.frow .fn{flex:1;font-weight:700;font-size:.88rem}
.frow .fsub{font-size:.68rem;color:var(--mut);margin-top:2px}
.frow .fw{font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;font-size:.87rem}
.hint{font-size:.72rem;color:var(--mut);text-align:center;margin-top:9px;line-height:1.4}

/* OVERVIEW TABLE (shared cards) */
.ov-header{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:10px;font-size:.78rem;color:var(--blue);font-weight:700;text-align:center}
.whose-turn{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:10px;display:flex;gap:12px;flex-wrap:wrap}
.wt-item{display:flex;align-items:center;gap:6px;font-size:.78rem}
.wt-item .wt-av{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.7rem;background:#0b1830}
.wt-item .wt-av.done{border-color:var(--green)}
.wt-item .wt-av.cur{border-color:var(--gold);background:#1c1800}
.wt-lbl{color:var(--mut)}
.wt-pick{font-weight:700;color:var(--txt)}
</style>
</head>

// ─── STATE ───────────────────────────────────────────────────────────────────
var S;
function newGame(){
  S={screen:"intro",year:1,decideIdx:0,
     climate:null,sharedHand:[],choices:[null,null,null,null],dealtYear:0,
     resort:{revealed:false,approved:null},
     lastResults:null,
     players:PLAYERS.map(function(nm){return {name:nm,cash:START,history:[],nw:[START]};})};
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function eur(n){n=Math.round(n);return n.toLocaleString("it-IT")+" €";}
function rnd(a,b){return Math.random()*(b-a)+a;}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function cardById(id){for(var i=0;i<DECK.length;i++)if(DECK[i].id===id)return DECK[i];return null;}
function leadIdx(){var b=0,bw=-1e9;S.players.forEach(function(p,i){if(p.cash>bw){bw=p.cash;b=i;}});return b;}
function el(tag,cls,html){var d=document.createElement(tag);if(cls)d.className=cls;if(html!=null)d.innerHTML=html;return d;}
function riskOf(c){var sp=c.hi-c.lo;return sp<0.25?"low":sp<0.9?"mid":"high";}
function riskChip(r){return r==="low"?"<span class='chip ch-rl'>🟢 Sicuro</span>":r==="mid"?"<span class='chip ch-rm'>🟡 Medio</span>":"<span class='chip ch-rh'>🔴 Alto</span>";}
function pct(x){return(x>=0?"+":"")+Math.round(x*100)+"%";}
function catChip(c){var ct=CATS[c];if(!ct)return "";return "<span class='chip ch-cat' style='color:"+ct.c+"'>"+ct.l+"</span>";}
function effMod(card,mods){
  var m=mods[card.cat]||0;
  (card.tags||[]).forEach(function(t){m+=mods[t]||0;});
  return m;
}

// ─── DEAL ─────────────────────────────────────────────────────────────────────
function chooseClimate(){
  if(S.year===2&&!S.resort.revealed){
    S.resort.revealed=true;S.resort.approved=Math.random()<0.55;
    return S.resort.approved
      ?{id:"resortY",lb:"🏗️ Resort APPROVATO!",ty:"good",ds:"Via libera al mega-resort: Immobili e Turismo esplodono.",mods:{immob:0.60,turis:0.50}}
      :{id:"resortN",lb:"❌ Resort bocciato",ty:"neutral",ds:"Progetto respinto per ragioni ambientali. Anno normale.",mods:{}};
  }
  return EVENTS[Math.floor(Math.random()*EVENTS.length)];
}
function dealTurn(){
  if(S.dealtYear===S.year)return;
  S.climate=chooseClimate();
  // Pick HAND cards usable by at least one player (min cost check)
  var minCash=Math.min.apply(null,S.players.map(function(p){return p.cash;}));
  var pool=shuffle(DECK.filter(function(c){return c.cost<=Math.max(minCash,START);}));
  // always include at least one safe option in hand
  var safe=pool.filter(function(c){return c.cat==="fin"&&c.cost<=minCash;});
  var risky=pool.filter(function(c){return c.cat!=="fin";});
  var hand=risky.slice(0,HAND-1);
  if(safe.length>0)hand.push(safe[0]); else hand.push(pool[HAND-1]||pool[0]);
  hand=shuffle(hand);
  S.sharedHand=hand;
  S.choices=[null,null,null,null];
  S.dealtYear=S.year;
}

// ─── RESOLVE ──────────────────────────────────────────────────────────────────
function resolveChoice(p,card){
  var mods=S.climate.mods||{};
  var mod=effMod(card,mods);
  if(card.cat==="azz"&&card.id==="lotto"){
    // superenalotto: 0.0001% chance of jackpot, rest = loss
    var jackpot=Math.random()<0.00001;
    var rate=jackpot?50.0:-1.0;
    return {delta:Math.round(card.cost*rate),label:card.e+" "+card.n,sub:jackpot?"🎉 JACKPOT!":"Nessuna vincita",rate:rate};
  }
  var base=rnd(card.lo,card.hi);
  var rate=clamp(base+mod,-1.0,card.hi+2.5);
  var delta=Math.round(card.cost*rate);
  // erosione liquidita` se inflazione
  var er=S.climate.erode||0;
  if(er>0){
    var idle=Math.max(0,p.cash-card.cost);
    delta-=Math.round(idle*er);
  }
  return {delta:delta,label:card.e+" "+card.n,sub:"Capitale "+eur(card.cost)+" · resa "+pct(rate),rate:rate};
}
function resolveTurn(){
  S.lastResults=S.players.map(function(p,i){
    var idx=S.choices[i];
    var card=idx!=null?S.sharedHand[idx]:null;
    var o;
    if(!card){
      // held cash (safety fallback)
      var er=S.climate.erode||0;
      var loss=Math.round(p.cash*er);
      o={delta:-loss,label:"🛡️ Liquidita` tenuta",sub:er>0?"Inflazione "+pct(-er):"Nessun rischio"};
    } else {
      o=resolveChoice(p,card);
    }
    return {i:i,delta:o.delta,label:o.label,sub:o.sub};
  });
  S.lastResults.forEach(function(r){
    var p=S.players[r.i];
    p.cash=Math.max(0,p.cash+r.delta);
    p.history.push(r);p.nw.push(p.cash);
  });
  S.screen=S.year>=YEARS?"final":"results";
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  var root=document.getElementById("screen");root.innerHTML="";
  if(S.screen==="intro")return renderIntro(root);
  if(S.screen==="final"){renderBar(root);return renderFinal(root);}
  renderBar(root);
  if(S.screen==="decision")return renderDecision(root);
  if(S.screen==="results")return renderResults(root);
}

function renderIntro(root){
  root.appendChild(el("div","sec-title","🌊 Benvenuti in Puglia"));
  var g=el("div","intro-grid");
  ["₿","🛡️","💊","⚡","🛢️","🥇","🥈","🤖","🍕","🫒","🍇","🏖️","🍹","✈️","🎰"].forEach(function(e){
    g.appendChild(el("div","intro-cell","<span class='e'>"+e+"</span>"));
  });
  root.appendChild(g);
  root.appendChild(el("div","rules",
    "<div class='sec-title'>📜 Come si gioca</div>"+
    li("💶","Ognuno parte con <b>10.000 €</b>")+
    li("🃏","Ogni anno vengono proposte <b>5 opportunita` a caso</b> tra oltre 50 disponibili")+
    li("🌍","Viene rivelato il <b>clima economico</b> (guerra, pandemia, boom, siccita`...)")+
    li("👆","<b>Ogni giocatore tocca una carta</b> e sceglie come investire")+
    li("🎲","Il clima modifica le rese: scegliere bene fa la differenza")+
    li("🏆","Dopo <b>10 anni</b> vince chi ha il patrimonio piu` alto")));
  root.appendChild(el("div","ev info",
    "<span class='lb'>🏗️ Evento in arrivo: il Resort</span>"+
    "<span class='ds'>Al 2° anno si scopre se una multinazionale costruira` un mega-resort vicino a voi. Se approvato: Immobili e Turismo esplodono.</span>"));
  var b=el("button","btn btn-gold mt","▶ Inizia il gioco");
  b.onclick=function(){startTurn();};
  root.appendChild(b);
}
function li(ic,t){return "<li><span class='ic'>"+ic+"</span><span>"+t+"</span></li>";}

function startTurn(){dealTurn();S.screen="decision";S.decideIdx=0;render();}

function renderBar(root){
  var tb=el("div","turnbar"),dots="";
  for(var i=0;i<YEARS;i++){var c=i<S.year-1?"done":i===S.year-1?"cur":"";dots+="<div class='dot "+c+"'></div>";}
  tb.innerHTML="<span class='yearlbl'>Anno "+S.year+" / "+YEARS+"</span><div class='dots'>"+dots+"</div>";
  root.appendChild(tb);
  var cards=el("div","cards"),lead=leadIdx();
  S.players.forEach(function(p,i){
    var last=p.history.length?p.history[p.history.length-1].delta:null;
    var dl=last==null?"":"<div class='dl "+(last>0?"up":last<0?"down":"flat")+"'>"+(last>0?"▲ +":last<0?"▼ ":"")+eur(Math.abs(last))+"</div>";
    cards.appendChild(el("div","pcard"+(i===lead&&S.year>1?" lead":""),
      "<div class='nm'>"+(i===lead&&S.year>1?"👑 ":"")+AV[p.name]+" "+p.name+"</div>"+
      "<div class='wl'>"+eur(p.cash)+"</div>"+dl));
  });
  root.appendChild(cards);
}

function renderDecision(root){
  var cl=S.climate;
  root.appendChild(el("div","ev "+cl.ty,"<span class='lb'>"+cl.lb+"</span><span class='ds'>"+cl.ds+"</span>"));

  // who has chosen so far
  var wt=el("div","whose-turn");
  S.players.forEach(function(p,i){
    var done=S.choices[i]!=null,cur=i===S.decideIdx;
    var card=done?S.sharedHand[S.choices[i]]:null;
    wt.innerHTML+="<div class='wt-item'><div class='wt-av "+(done?"done":cur?"cur":"")+"'>"+AV[p.name]+"</div>"+
      "<div><div class='wt-lbl'>"+p.name+"</div>"+(done&&card?"<div class='wt-pick'>"+card.e+" "+card.n.split(" ")[0]+"</div>":"")+"</div></div>";
  });
  root.appendChild(wt);

  var p=S.players[S.decideIdx];
  var hd=el("div","choice-hd");
  hd.innerHTML="<div class='ch-top'><div class='ch-who'>"+AV[p.name]+" "+p.name+"</div>"+
    "<div class='ch-step'>Giocatore "+(S.decideIdx+1)+" / 4</div></div>"+
    "<div class='ch-cash'>Patrimonio: <b>"+eur(p.cash)+"</b></div>"+
    "<div class='ch-hint'>👇 Tocca una carta per scegliere:</div>";
  root.appendChild(hd);

  var mods=S.climate.mods||{};
  S.sharedHand.forEach(function(c,idx){
    root.appendChild(buildCard(c,idx,p,mods));
  });

  var sel=S.choices[S.decideIdx];
  var confirm=el("button","btn btn-gold mt",
    S.decideIdx<3?"Conferma ▶ tocca a "+PLAYERS[S.decideIdx+1]:"⚡ Risolvi l'Anno "+S.year);
  confirm.disabled=(sel==null);
  confirm.onclick=function(){
    if(S.choices[S.decideIdx]==null)return;
    if(S.decideIdx<3){S.decideIdx++;render();}
    else{resolveTurn();render();}
  };
  root.appendChild(confirm);
  if(S.decideIdx>0){
    var back=el("button","btn btn-ghost btn-sm mt-s","◀ Indietro");
    back.onclick=function(){S.decideIdx--;render();};
    root.appendChild(back);
  }
  root.appendChild(el("div","hint","Le stesse 5 opportunita` per tutti. Il clima rivelato qui sopra puo` favorire o penalizzare alcune categorie."));
}

function buildCard(c,idx,p,mods){
  var sel=S.choices[S.decideIdx]===idx;
  var affordable=c.cost<=p.cash;
  var d=el("div","ccard"+(sel?" sel":"")+((!affordable)?" dis":""));
  var r=riskOf(c), mod=effMod(c,mods);
  var favChip=mod>0?"<span class='chip ch-fav'>📈 favorito +"+Math.round(mod*100)+"%</span>":mod<0?"<span class='chip ch-unf'>📉 sfavorito "+Math.round(mod*100)+"%</span>":"";
  var costChip=!affordable?"<span class='chip ch-rh'>❌ Fondi insufficienti</span>":"<span class='chip ch-cost'>💶 "+eur(c.cost)+"</span>";
  d.innerHTML="<div class='chk'>"+(sel?"✓":"")+"</div>"+
    "<div class='top'><div class='em'>"+c.e+"</div><div class='info'><div class='cn'>"+c.n+"</div><div class='cd'>"+c.ds+"</div></div></div>"+
    "<div class='chips'>"+costChip+
      "<span class='chip ch-rng'>"+pct(c.lo)+" … "+pct(c.hi)+"</span>"+
      riskChip(r)+catChip(c.cat)+favChip+"</div>";
  if(affordable){
    d.onclick=function(){S.choices[S.decideIdx]=idx;render();};
  }
  return d;
}

function renderResults(root){
  var cl=S.climate;
  root.appendChild(el("div","ev "+cl.ty,"<span class='lb'>"+cl.lb+"</span><span class='ds'>"+cl.ds+"</span>"));
  root.appendChild(el("div","sec-title","📊 Risultati Anno "+S.year));
  S.players.forEach(function(p){
    var h=p.history[p.history.length-1];
    root.appendChild(el("div","rrow",
      "<div class='rh'><div><div class='rn'>"+AV[p.name]+" "+p.name+"</div>"+
      "<div class='rsub'>"+h.label+"</div>"+
      "<div class='rsub'>"+h.sub+"</div></div>"+
      "<div class='rg "+(h.delta>=0?"pos":"neg")+"'>"+(h.delta>=0?"+":"")+eur(h.delta)+"</div></div>"));
  });
  var b=el("button","btn btn-gold mt",S.year>=YEARS?"🏆 Classifica finale":"▶ Avanti all'Anno "+(S.year+1));
  b.onclick=function(){S.year++;startTurn();};
  root.appendChild(b);
}

function renderFinal(root){
  var sorted=S.players.slice().sort(function(a,b){return b.cash-a.cash;});
  root.appendChild(el("div","sec-title","🏆 Classifica finale · "+YEARS+" anni"));
  var pod=el("div","podium"),slots=[["second","🥈"],["first","🥇"],["third","🥉"]];
  [sorted[1],sorted[0],sorted[2]].forEach(function(p,k){
    if(!p)return;
    pod.appendChild(el("div","pp "+slots[k][0],
      "<div class='pe'>"+slots[k][1]+"</div><div class='pn'>"+AV[p.name]+" "+p.name+"</div>"+
      "<div class='pw'>"+eur(p.cash)+"</div>"));
  });
  root.appendChild(pod);
  sorted.forEach(function(p,i){
    var g=p.cash-START;
    root.appendChild(el("div","frow",
      "<div class='rk'>"+(i+1)+"</div>"+
      "<div><div class='fn'>"+AV[p.name]+" "+p.name+"</div>"+
      "<div class='fsub'>"+(g>=0?"+":"")+eur(g)+" sul capitale iniziale</div></div>"+
      sparkline(p.nw)+
      "<div class='fw'>"+eur(p.cash)+"</div>"));
  });
  var win=sorted[0],mil=win.cash>=1000000;
  root.appendChild(el("div","ev "+(mil?"good":"info")+" mt",
    "<span class='lb'>"+(mil?"🎉 Abbiamo un milionario!":"🎯 Vince "+win.name+"!")+"</span>"+
    "<span class='ds'>"+(mil?win.name+" ha superato il milione. Imprenditore pugliese dell'anno!":win.name+" chiude con "+eur(win.cash)+". Nessun milione ancora — riprovate!")+"</span>"));
  var b=el("button","btn btn-gold mt","🔄 Nuova partita");
  b.onclick=function(){newGame();render();};
  root.appendChild(b);
  root.appendChild(el("div","hint","Grazie per aver giocato all'Edizione Puglia 🌊"));
}

function sparkline(vals){
  var w=60,h=22,p=2,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=Math.max(1,mx-mn);
  var pts=vals.map(function(v,i){
    return (p+i*(w-2*p)/(vals.length-1||1)).toFixed(1)+","+(h-p-((v-mn)/rng)*(h-2*p)).toFixed(1);
  }).join(" ");
  var col=vals[vals.length-1]>=vals[0]?"#4ade80":"#f87171";
  return "<svg width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"' style='flex-shrink:0'><polyline fill='none' stroke='"+col+"' stroke-width='2' stroke-linejoin='round' stroke-linecap='round' points='"+pts+"'/></svg>";
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
newGame();render();
