<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Chi Diventa Milionario? - Edizione Puglia</title>
<style>
:root{
  --bg:#0b1220; --panel:#141d30; --panel2:#1b2740; --line:#2a3a5c;
  --gold:#facc15; --green:#4ade80; --red:#f87171; --blue:#60a5fa;
  --txt:#e8eef7; --mut:#8aa0c0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;overflow-x:hidden}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hd{background:linear-gradient(135deg,#16335c,#0d4c81 60%,#0a3a66);padding:14px 18px;text-align:center;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:20}
.hd h1{font-size:1.2rem;color:var(--gold);line-height:1.15}
.hd .sub{color:#a9cdf0;font-size:.76rem;margin-top:3px}
.screen{padding:16px;flex:1;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.btn{display:block;width:100%;border:none;border-radius:12px;padding:15px;font-size:1rem;font-weight:800;cursor:pointer;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#f0b90b);color:#0b1220;box-shadow:0 6px 18px rgba(250,204,21,.25)}
.btn-ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn-sm{padding:11px;font-size:.9rem;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.mt{margin-top:14px}.mt-s{margin-top:8px}
.title{font-size:1.05rem;font-weight:800;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.muted{color:var(--mut)}

.rules{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.rules li{list-style:none;padding:8px 0;border-bottom:1px solid #1d2944;display:flex;gap:10px;align-items:flex-start;font-size:.9rem;line-height:1.4}
.rules li:last-child{border-bottom:none}
.rules .ic{font-size:1.1rem;flex-shrink:0}
.samp{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.samp .s{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center}
.samp .s .e{font-size:1.3rem}
.samp .s .n{font-size:.68rem;color:var(--mut);margin-top:3px;line-height:1.2}

.turnbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.yearlbl{font-weight:800;color:var(--gold);font-size:1rem;white-space:nowrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:13px;height:13px;border-radius:50%;background:#22304d;border:2px solid #2c3d60;transition:.3s}
.dot.done{background:var(--green);border-color:#22c55e}
.dot.cur{background:var(--gold);border-color:#eab308;box-shadow:0 0 8px rgba(250,204,21,.6)}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px;position:relative;transition:.3s}
.pcard.lead{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 6px 16px rgba(250,204,21,.15)}
.pcard .nm{font-weight:700;font-size:.86rem;display:flex;align-items:center;gap:5px}
.pcard .wl{font-size:1.12rem;font-weight:900;color:var(--green);margin-top:2px;font-variant-numeric:tabular-nums}
.pcard .dl{font-size:.72rem;margin-top:1px;font-weight:700}
.dl.up{color:var(--green)}.dl.down{color:var(--red)}.dl.flat{color:var(--mut)}

.event{border-radius:14px;padding:13px 15px;margin-bottom:16px;border:1px solid;animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.event .lb{font-size:.98rem;font-weight:800;display:block;margin-bottom:4px}
.event .ds{font-size:.83rem;line-height:1.45;opacity:.92}
.event.good{background:#06281a;border-color:#1f9d57;color:#86efac}
.event.bad{background:#2a0c0c;border-color:#c43d3d;color:#fca5a5}
.event.neutral{background:#1a1c24;border-color:#5b6472;color:#c2c9d4}
.event.info{background:#0a1f3a;border-color:#2f72c4;color:#9ccdf5}

.dechead{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.dechead .who{font-size:1.15rem;font-weight:900;display:flex;align-items:center;gap:7px}
.dechead .step{font-size:.72rem;color:var(--mut);background:#0e1c33;border:1px solid #243450;padding:3px 9px;border-radius:20px}
.cashline{font-size:.84rem;color:var(--mut);margin-bottom:12px}
.cashline b{color:var(--txt)}
.choosehint{font-size:.8rem;color:var(--blue);font-weight:700;margin-bottom:10px}

.mcard{background:var(--panel);border:1.5px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px;cursor:pointer;transition:.16s;position:relative}
.mcard:active{transform:scale(.99)}
.mcard.sel{border-color:var(--gold);background:#1c2210;box-shadow:0 0 0 1px var(--gold) inset,0 6px 16px rgba(250,204,21,.12)}
.mcard.dis{opacity:.4;pointer-events:none}
.mcard .top{display:flex;align-items:center;gap:10px}
.mcard .e{font-size:1.7rem;flex-shrink:0}
.mcard .nm{font-weight:800;font-size:.92rem}
.mcard .ds{font-size:.74rem;color:var(--mut);margin-top:1px;line-height:1.3}
.mcard .selmark{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:#0b1220;font-weight:900}
.mcard.sel .selmark{background:var(--gold);border-color:var(--gold)}
.mcard .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.chip{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:20px;border:1px solid}
.chip.cap{background:#0e1c33;border-color:#243450;color:#a9cdf0}
.chip.rng{background:#0e1c33;border-color:#243450;color:#cbd5e1}
.chip.cat{border-color:#314058}
.chip.risk-low{background:#06281a;border-color:#1f9d57;color:#86efac}
.chip.risk-mid{background:#2a2400;border-color:#b08900;color:#fcd34d}
.chip.risk-high{background:#2a0c0c;border-color:#c43d3d;color:#fca5a5}
.chip.fav{background:#06281a;border-color:#1f9d57;color:#86efac}
.chip.unf{background:#2a0c0c;border-color:#c43d3d;color:#fca5a5}

.rrow{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.rrow .rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rrow .rn{font-weight:800;font-size:.93rem;display:flex;align-items:center;gap:6px}
.rrow .rsub{font-size:.74rem;color:var(--mut);margin-top:2px}
.rrow .rg{font-weight:900;font-size:1.05rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.rg.pos{color:var(--green)}.rg.neg{color:var(--red)}

.podium{display:flex;justify-content:center;align-items:flex-end;gap:8px;margin:8px 0 18px}
.pp{flex:1;max-width:120px;text-align:center;border-radius:12px 12px 0 0;padding:12px 6px;border:2px solid;border-bottom:none}
.pp .pe{font-size:1.6rem}
.pp .pn{font-weight:800;font-size:.84rem;margin:4px 0 1px}
.pp .pw{font-size:.78rem;font-weight:900;color:var(--green);font-variant-numeric:tabular-nums}
.pp.first{background:#2a2400;border-color:var(--gold);height:140px;order:2}
.pp.second{background:#1a1f2c;border-color:#9aa6b8;height:115px;order:1}
.pp.third{background:#241600;border-color:#c2790f;height:95px;order:3}
.frow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.frow .rk{font-weight:900;color:var(--gold);font-size:1rem;width:22px}
.frow .fn{font-weight:700;flex:1}
.frow .fw{font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;font-size:.9rem}
.hint{font-size:.74rem;color:var(--mut);text-align:center;margin-top:10px;line-height:1.4}
</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <h1>💰 Chi Diventa Milionario?</h1>
    <div class="sub">Edizione Puglia · 4 giocatori · 10 anni · 1 vincitore</div>
  </div>
  <div class="screen" id="screen"></div>
</div>

<script>
"use strict";

// ════════════════ CONFIG ════════════════
var PLAYERS=["Alberto","Alice","Nicolas","Mattia"];
var AVATARS={Alberto:"🧔",Alice:"👩",Nicolas:"👨",Mattia:"🧑"};
var START=10000, YEARS=10, HAND=3;

// category meta
var CATS={
  tech:{l:"Tech",c:"#a78bfa"}, immobili:{l:"Immobili",c:"#f472b6"},
  turismo:{l:"Turismo",c:"#22d3ee"}, food:{l:"Food",c:"#fb923c"},
  auto:{l:"Auto",c:"#60a5fa"}, finanza:{l:"Finanza",c:"#4ade80"},
  crypto:{l:"Crypto",c:"#fbbf24"}, extra:{l:"Azzardo",c:"#f87171"}
};

// ~34 opportunità nel mazzo (stake = capitale impiegato, lo/hi = resa annua)
var DECK=[
  {id:"app", e:"📱", n:"App per turisti", ds:"Startup digitale per i vacanzieri", cost:3000, cat:"tech", lo:-0.50, hi:1.20},
  {id:"ai", e:"🤖", n:"Startup di AI", ds:"Scommessa tecnologica ad alto potenziale", cost:5000, cat:"tech", lo:-0.60, hi:1.50},
  {id:"ecom", e:"🛒", n:"E-commerce tipico", ds:"Vendita online di prodotti pugliesi", cost:2500, cat:"tech", lo:-0.30, hi:0.80},
  {id:"garage", e:"🏠", n:"Garage da affittare", ds:"Rendita immobiliare tranquilla", cost:8000, cat:"immobili", lo:0.05, hi:0.18},
  {id:"trullo", e:"🏡", n:"Trullo da ristrutturare", ds:"Ristruttura e rivendi", cost:12000, cat:"immobili", lo:-0.10, hi:0.60},
  {id:"mare", e:"🏖️", n:"Casa al mare in affitto", ds:"Affitti estivi a Gallipoli", cost:15000, cat:"immobili", lo:0.00, hi:0.40},
  {id:"palazzo", e:"🏢", n:"Quota in palazzina", ds:"Investimento immobiliare grosso", cost:20000, cat:"immobili", lo:-0.05, hi:0.30},
  {id:"chiosco", e:"🍹", n:"Chiosco sulla spiaggia", ds:"Drink e granite tutta estate", cost:6000, cat:"turismo", lo:0.00, hi:0.45},
  {id:"barche", e:"⛵", n:"Noleggio barche", ds:"Gite in barca tra le grotte", cost:9000, cat:"turismo", lo:-0.30, hi:0.70},
  {id:"bb", e:"🛏️", n:"B&B nel centro storico", ds:"Ospitalità tra i vicoli", cost:11000, cat:"turismo", lo:-0.10, hi:0.55},
  {id:"van", e:"🚐", n:"Tour in van del Salento", ds:"Escursioni guidate", cost:4000, cat:"turismo", lo:-0.20, hi:0.60},
  {id:"lido", e:"🛟", n:"Lido attrezzato", ds:"Ombrelloni, lettini e bar", cost:14000, cat:"turismo", lo:-0.20, hi:0.60},
  {id:"pizzica", e:"🪗", n:"Festival di pizzica", ds:"Eventi musicali estivi", cost:4000, cat:"turismo", lo:-0.40, hi:0.80},
  {id:"olio", e:"🫒", n:"Uliveto (olio EVO)", ds:"Oro verde di Puglia", cost:7000, cat:"food", lo:-0.20, hi:0.50},
  {id:"vino", e:"🍇", n:"Vigneto di Primitivo", ds:"Vino pregiato del Salento", cost:10000, cat:"food", lo:-0.25, hi:0.70},
  {id:"burrata", e:"🧀", n:"Caseificio (burrata)", ds:"Latticini freschi a km zero", cost:5000, cat:"food", lo:-0.10, hi:0.50},
  {id:"pizzeria", e:"🍕", n:"Pizzeria gourmet", ds:"Forno a legna e impasti speciali", cost:6000, cat:"food", lo:-0.40, hi:0.90},
  {id:"pesce", e:"🐟", n:"Pescheria", ds:"Pescato del giorno", cost:3500, cat:"food", lo:-0.20, hi:0.45},
  {id:"gelato", e:"🍦", n:"Gelateria artigianale", ds:"Gusti del territorio", cost:4500, cat:"food", lo:-0.20, hi:0.60},
  {id:"sagra", e:"🎪", n:"Sagra delle orecchiette", ds:"Evento gastronomico di paese", cost:3000, cat:"food", lo:-0.20, hi:0.50},
  {id:"cozze", e:"🦪", n:"Allevamento di cozze", ds:"Mitilicoltura a Taranto", cost:5000, cat:"food", lo:-0.30, hi:0.60},
  {id:"usate", e:"🚗", n:"Compravendita auto usate", ds:"Compra basso, vendi alto", cost:4000, cat:"auto", lo:-0.40, hi:1.00},
  {id:"scooter", e:"🛵", n:"Noleggio scooter", ds:"Due ruote per i turisti", cost:3000, cat:"auto", lo:-0.30, hi:0.60},
  {id:"flotta", e:"🚙", n:"Flotta a noleggio", ds:"Auto a noleggio in aeroporto", cost:13000, cat:"auto", lo:-0.30, hi:0.70},
  {id:"bond", e:"🏦", n:"Obbligazioni statali", ds:"Cedola sicura e noiosa", cost:5000, cat:"finanza", lo:0.02, hi:0.05},
  {id:"etf", e:"📊", n:"ETF mondiale", ds:"Mercati globali diversificati", cost:5000, cat:"finanza", lo:-0.15, hi:0.25},
  {id:"oro", e:"🥇", n:"Oro fisico", ds:"Bene rifugio", cost:6000, cat:"finanza", lo:-0.10, hi:0.20},
  {id:"diamanti", e:"💎", n:"Diamanti da investimento", ds:"Pietre preziose", cost:8000, cat:"finanza", lo:-0.20, hi:0.30},
  {id:"solare", e:"🌻", n:"Campo fotovoltaico", ds:"Energia che rende negli anni", cost:16000, cat:"finanza", lo:0.03, hi:0.25},
  {id:"btc", e:"₿", n:"Bitcoin", ds:"Cripto volatile per stomaci forti", cost:4000, cat:"crypto", lo:-0.70, hi:2.00},
  {id:"meme", e:"🪙", n:"Memecoin pugliese", ds:"Pump o crollo, chi lo sa", cost:2000, cat:"crypto", lo:-0.95, hi:4.00},
  {id:"bet", e:"🎰", n:"Scommessa sportiva", ds:"Tutto sul derby", cost:1500, cat:"extra", lo:-1.00, hi:2.50},
  {id:"poker", e:"🃏", n:"Tavolo da poker", ds:"Serata ad alto rischio", cost:2000, cat:"extra", lo:-1.00, hi:1.80},
  {id:"arte", e:"🎨", n:"Galleria d'arte", ds:"Compra opere emergenti", cost:7000, cat:"extra", lo:-0.50, hi:0.70}
];

// clima economico annuale (modifica le rese per categoria)
var CLIMATES=[
  {id:"boomTech", lb:"🚀 Boom tecnologico", ty:"good", ds:"Le startup esplodono: il Tech vola.", mods:{tech:0.45}},
  {id:"crisi", lb:"📉 Crisi finanziaria", ty:"bad", ds:"Mercati in rosso: Tech, Crypto, Finanza e Auto soffrono.", mods:{tech:-0.25,crypto:-0.35,finanza:-0.15,auto:-0.20}},
  {id:"estate", lb:"☀️ Estate da record", ty:"good", ds:"Turismo e Food incassano alla grande.", mods:{turismo:0.50,food:0.30}},
  {id:"maltempo", lb:"⛈️ Stagione di maltempo", ty:"bad", ds:"Spiagge vuote: Turismo e Food in calo.", mods:{turismo:-0.40,food:-0.20}},
  {id:"bce", lb:"🏦 La BCE alza i tassi", ty:"neutral", ds:"Finanza premiata, Immobili un po' frenati.", mods:{finanza:0.07,immobili:-0.10}},
  {id:"cryptoUp", lb:"🌕 Crypto mania", ty:"good", ds:"Le cripto vanno alla luna.", mods:{crypto:1.20}},
  {id:"cryptoDn", lb:"💥 Crypto crash", ty:"bad", ds:"Bagno di sangue sulle cripto.", mods:{crypto:-0.70}},
  {id:"infl", lb:"📈 Inflazione alle stelle", ty:"bad", ds:"La liquidità ferma perde valore; il Food sale.", mods:{food:0.10}, erode:0.04},
  {id:"turismoBoom", lb:"🧳 Turismo in boom", ty:"good", ds:"Puglia presa d'assalto dai visitatori.", mods:{turismo:0.35}},
  {id:"siccita", lb:"🏜️ Siccità", ty:"bad", ds:"Raccolti scarsi: il Food cala.", mods:{food:-0.40}},
  {id:"olioTop", lb:"🫒 Annata d'olio record", ty:"good", ds:"Olio e prodotti agricoli alle stelle.", mods:{food:0.45}},
  {id:"mattone", lb:"🧱 Mattone d'oro", ty:"good", ds:"Il mercato immobiliare si surriscalda.", mods:{immobili:0.40}},
  {id:"calmo", lb:"📅 Anno tranquillo", ty:"neutral", ds:"Nessun evento straordinario.", mods:{}},
  {id:"stabile", lb:"🌤️ Mercato stabile", ty:"neutral", ds:"I fondamentali tengono, nessuna sorpresa.", mods:{}}
];

// ════════════════ STATE ════════════════
var S;
function newGame(){
  S={ screen:"intro", year:1, decideIdx:0,
      climate:null, hands:[], choices:[], dealtYear:0,
      resort:{revealed:false, approved:null},
      players:PLAYERS.map(function(nm){ return {name:nm,cash:START,history:[],nw:[START]}; }) };
}

// ════════════════ HELPERS ════════════════
function eur(n){ n=Math.round(n); return n.toLocaleString("it-IT")+" €"; }
function rnd(a,b){ return Math.random()*(b-a)+a; }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function cardById(id){ for(var i=0;i<DECK.length;i++) if(DECK[i].id===id) return DECK[i]; return null; }
function net(p){ return p.cash; }
function leadIdx(){ var b=0,bw=-1e9; S.players.forEach(function(p,i){ if(net(p)>bw){bw=net(p);b=i;} }); return b; }
function el(tag,cls,html){ var d=document.createElement(tag); if(cls)d.className=cls; if(html!=null)d.innerHTML=html; return d; }
function riskOf(c){ var sp=c.hi-c.lo; return sp<0.25?"low":sp<0.9?"mid":"high"; }
function riskLbl(r){ return r==="low"?"🟢 Sicuro":r==="mid"?"🟡 Medio":"🔴 Alto"; }
function pct(x){ return (x>=0?"+":"")+Math.round(x*100)+"%"; }

// ════════════════ TURN SETUP ════════════════
function chooseClimate(){
  if(S.year===2 && !S.resort.revealed){
    S.resort.revealed=true; S.resort.approved=Math.random()<0.55;
    return S.resort.approved
      ? {id:"resortY", lb:"🏗️ Resort APPROVATO!", ty:"good", ds:"Via libera al mega-resort: Immobili e Turismo esplodono quest'anno.", mods:{immobili:0.60,turismo:0.50}}
      : {id:"resortN", lb:"❌ Resort bocciato", ty:"neutral", ds:"Progetto respinto per ragioni ambientali. Nessun effetto particolare.", mods:{}};
  }
  return CLIMATES[Math.floor(Math.random()*CLIMATES.length)];
}
function dealTurn(){
  if(S.dealtYear===S.year) return; // già distribuito
  S.climate=chooseClimate();
  S.hands=S.players.map(function(p){
    var pool=shuffle(DECK).filter(function(c){ return c.cost<=p.cash; });
    var picks=pool.slice(0,HAND).map(function(c){ return {kind:"opp",id:c.id}; });
    // sempre disponibili: deposito + liquidità
    var dep=Math.min(p.cash, Math.max(2000, Math.round(p.cash*0.4/500)*500));
    picks.push({kind:"dep", stake:dep});
    picks.push({kind:"liq"});
    return picks;
  });
  S.choices=[null,null,null,null];
  S.dealtYear=S.year;
}

// ════════════════ RESOLVE ════════════════
function moveOutcome(p, mv){
  var mods=S.climate.mods||{};
  if(mv.kind==="opp"){
    var c=cardById(mv.id);
    var rate=clamp(rnd(c.lo,c.hi)+(mods[c.cat]||0), -1, c.hi+1.6);
    var delta=Math.round(c.cost*rate);
    return {delta:delta, label:c.e+" "+c.n, sub:"Capitale "+eur(c.cost)+" · resa "+pct(rate)};
  }
  if(mv.kind==="dep"){
    var r=0.03+(mods.finanza||0);
    var d=Math.round(mv.stake*r);
    return {delta:d, label:"💰 Conto deposito", sub:"Capitale "+eur(mv.stake)+" · "+pct(r)};
  }
  // liquidità
  var er=S.climate.erode||0;
  var loss=Math.round(p.cash*er);
  return {delta:-loss, label:"🛡️ Tieni la liquidità", sub: er>0? "Inflazione "+pct(-er) : "Nessun rischio"};
}
function resolveTurn(){
  S.lastResults=S.players.map(function(p,i){
    var mv=S.hands[i][S.choices[i]];
    var o=moveOutcome(p,mv);
    return {i:i, delta:o.delta, label:o.label, sub:o.sub};
  });
  S.lastResults.forEach(function(r){
    var p=S.players[r.i];
    p.cash=Math.max(0,p.cash+r.delta);
    p.history.push(r); p.nw.push(p.cash);
  });
  S.screen = S.year>=YEARS ? "final" : "results";
}

// ════════════════ RENDER ════════════════
function render(){
  var root=document.getElementById("screen"); root.innerHTML="";
  if(S.screen==="intro") return renderIntro(root);
  if(S.screen==="final"){ renderBar(root); return renderFinal(root); }
  renderBar(root);
  if(S.screen==="decision") return renderDecision(root);
  if(S.screen==="results") return renderResults(root);
}

function renderIntro(root){
  root.appendChild(el("div","title","🌊 Benvenuti in Puglia"));
  var samp=el("div","samp");
  ["📱","🏠","🍹","🫒","🍇","🚗","₿","🥇","🎰"].forEach(function(e){
    samp.appendChild(el("div","s","<div class='e'>"+e+"</div>"));
  });
  root.appendChild(samp);
  root.appendChild(el("div","rules",
    "<div class='title'>📜 Come si gioca</div>"+
    li("💶","Ognuno parte con <b>10.000 €</b>")+
    li("🃏","Ogni anno ti vengono <b>proposte 5 mosse</b> pescate da un mazzo di oltre 30 opportunità")+
    li("👉","<b>Ognuno sceglie una mossa</b>, conoscendo già il clima economico dell'anno")+
    li("🎲","Io applico clima, fortuna e rischio e calcolo il risultato")+
    li("🏆","Dopo <b>10 anni</b> vince chi ha il patrimonio più alto")));
  root.appendChild(el("div","event info",
    "<span class='lb'>🏗️ In arrivo: il Resort</span>"+
    "<span class='ds'>Una multinazionale vuole costruire un mega-resort vicino a voi. Se al 2° anno il progetto passa, Immobili e Turismo voleranno.</span>"));
  var b=el("button","btn btn-gold mt","▶ Inizia il gioco");
  b.onclick=function(){ startTurn(); };
  root.appendChild(b);
}
function li(ic,t){ return "<li><span class='ic'>"+ic+"</span><span>"+t+"</span></li>"; }

function startTurn(){
  dealTurn();
  S.screen="decision"; S.decideIdx=0;
  render();
}

function renderBar(root){
  var tb=el("div","turnbar"), dots="";
  for(var i=0;i<YEARS;i++){ var c=i<S.year-1?"done":(i===S.year-1?"cur":""); dots+="<div class='dot "+c+"'></div>"; }
  tb.innerHTML="<span class='yearlbl'>Anno "+S.year+" / "+YEARS+"</span><div class='dots'>"+dots+"</div>";
  root.appendChild(tb);
  var cards=el("div","cards"), lead=leadIdx();
  S.players.forEach(function(p,i){
    var last=p.history.length? p.history[p.history.length-1].delta : null;
    var dl=last==null?"":"<div class='dl "+(last>0?"up":last<0?"down":"flat")+"'>"+(last>0?"▲ +":last<0?"▼ ":"")+eur(Math.abs(last))+"</div>";
    cards.appendChild(el("div","pcard"+(i===lead&&S.year>1?" lead":""),
      "<div class='nm'>"+(i===lead&&S.year>1?"👑 ":"")+AVATARS[p.name]+" "+p.name+"</div>"+
      "<div class='wl'>"+eur(net(p))+"</div>"+dl));
  });
  root.appendChild(cards);
}

function renderDecision(root){
  var cl=S.climate;
  root.appendChild(el("div","event "+cl.ty,
    "<span class='lb'>"+cl.lb+"</span><span class='ds'>"+cl.ds+"</span>"));
  var p=S.players[S.decideIdx];
  root.appendChild(el("div","",
    "<div class='dechead'><div class='who'>"+AVATARS[p.name]+" "+p.name+"</div>"+
    "<div class='step'>Giocatore "+(S.decideIdx+1)+" / 4</div></div>"));
  root.appendChild(el("div","cashline","Patrimonio: <b>"+eur(p.cash)+"</b>"));
  root.appendChild(el("div","choosehint","👉 Scegli la tua mossa per quest'anno:"));

  var hand=S.hands[S.decideIdx];
  var wrap=el("div");
  hand.forEach(function(mv,idx){
    wrap.appendChild(buildMoveCard(p,mv,idx));
  });
  root.appendChild(wrap);

  var sel=S.choices[S.decideIdx];
  var confirm=el("button","btn btn-gold mt", S.decideIdx<3? "Conferma ▶ tocca a "+PLAYERS[S.decideIdx+1] : "⚡ Risolvi l'Anno "+S.year);
  confirm.disabled = (sel==null);
  confirm.onclick=function(){
    if(S.choices[S.decideIdx]==null) return;
    if(S.decideIdx<3){ S.decideIdx++; render(); }
    else { resolveTurn(); render(); }
  };
  root.appendChild(confirm);
  if(S.decideIdx>0){
    var back=el("button","btn btn-ghost btn-sm mt-s","◀ Indietro");
    back.onclick=function(){ S.decideIdx--; render(); };
    root.appendChild(back);
  }
  root.appendChild(el("div","hint","Le mosse cambiano ogni anno. Il clima qui sopra può favorire o penalizzare alcune categorie."));
}

function buildMoveCard(p,mv,idx){
  var sel = S.choices[S.decideIdx]===idx;
  var d=el("div","mcard"+(sel?" sel":""));
  d.innerHTML="<div class='selmark'>"+(sel?"✓":"")+"</div>";
  var mods=S.climate.mods||{};
  if(mv.kind==="opp"){
    var c=cardById(mv.id), r=riskOf(c), cm=CATS[c.cat];
    var fav = mods[c.cat]||0;
    var favChip = fav>0? "<span class='chip fav'>📈 favorito</span>" : fav<0? "<span class='chip unf'>📉 sfavorito</span>" : "";
    d.innerHTML+=
      "<div class='top'><div class='e'>"+c.e+"</div><div><div class='nm'>"+c.n+"</div><div class='ds'>"+c.ds+"</div></div></div>"+
      "<div class='meta'>"+
        "<span class='chip cap'>💶 "+eur(c.cost)+"</span>"+
        "<span class='chip rng'>resa "+pct(c.lo)+" … "+pct(c.hi)+"</span>"+
        "<span class='chip risk-"+r+"'>"+riskLbl(r)+"</span>"+
        "<span class='chip cat' style='color:"+cm.c+"'>"+cm.l+"</span>"+favChip+
      "</div>";
  } else if(mv.kind==="dep"){
    var fr=0.03+(mods.finanza||0);
    d.innerHTML+=
      "<div class='top'><div class='e'>💰</div><div><div class='nm'>Conto deposito</div><div class='ds'>Rendimento garantito, zero pensieri</div></div></div>"+
      "<div class='meta'><span class='chip cap'>💶 "+eur(mv.stake)+"</span>"+
        "<span class='chip rng'>"+pct(fr)+" sicuro</span>"+
        "<span class='chip risk-low'>🟢 Sicuro</span></div>";
  } else {
    var er=S.climate.erode||0;
    d.innerHTML+=
      "<div class='top'><div class='e'>🛡️</div><div><div class='nm'>Tieni la liquidità</div><div class='ds'>Non investi: aspetti tempi migliori</div></div></div>"+
      "<div class='meta'><span class='chip cap'>Nessun capitale a rischio</span>"+
        (er>0?"<span class='chip unf'>📉 inflazione "+pct(-er)+"</span>":"<span class='chip risk-low'>🟢 Sicuro</span>")+"</div>";
  }
  d.onclick=function(){ S.choices[S.decideIdx]=idx; render(); };
  return d;
}

function renderResults(root){
  var cl=S.climate;
  root.appendChild(el("div","event "+cl.ty,"<span class='lb'>"+cl.lb+"</span><span class='ds'>"+cl.ds+"</span>"));
  root.appendChild(el("div","title","📊 Risultati Anno "+S.year));
  S.players.forEach(function(p){
    var h=p.history[p.history.length-1];
    root.appendChild(el("div","rrow",
      "<div class='rh'><div><div class='rn'>"+AVATARS[p.name]+" "+p.name+"</div>"+
      "<div class='rsub'>"+h.label+" — "+h.sub+"</div></div>"+
      "<div class='rg "+(h.delta>=0?"pos":"neg")+"'>"+(h.delta>=0?"+":"")+eur(h.delta)+"</div></div>"));
  });
  var b=el("button","btn btn-gold mt", S.year>=YEARS? "🏆 Classifica finale" : "▶ Avanti all'Anno "+(S.year+1));
  b.onclick=function(){ S.year++; startTurn(); };
  root.appendChild(b);
}

function renderFinal(root){
  var sorted=S.players.slice().sort(function(a,b){ return net(b)-net(a); });
  root.appendChild(el("div","title","🏆 Classifica finale · "+YEARS+" anni"));
  var pod=el("div","podium"), slots=[["second","🥈"],["first","🥇"],["third","🥉"]];
  [sorted[1],sorted[0],sorted[2]].forEach(function(p,k){
    if(!p) return;
    pod.appendChild(el("div","pp "+slots[k][0],
      "<div class='pe'>"+slots[k][1]+"</div><div class='pn'>"+AVATARS[p.name]+" "+p.name+"</div>"+
      "<div class='pw'>"+eur(net(p))+"</div>"));
  });
  root.appendChild(pod);
  sorted.forEach(function(p,i){
    var g=net(p)-START;
    root.appendChild(el("div","frow",
      "<div class='rk'>"+(i+1)+"</div>"+
      "<div class='fn'>"+AVATARS[p.name]+" "+p.name+
        "<div style='font-size:.7rem;color:#8aa0c0'>"+(g>=0?"+":"")+eur(g)+" sul capitale</div></div>"+
      sparkline(p.nw)+
      "<div class='fw'>"+eur(net(p))+"</div>"));
  });
  var win=sorted[0], mil=net(win)>=1000000;
  root.appendChild(el("div","event "+(mil?"good":"info")+" mt",
    "<span class='lb'>"+(mil?"🎉 Abbiamo un milionario!":"🎯 Vince "+win.name+"!")+"</span>"+
    "<span class='ds'>"+(mil? win.name+" ha superato il milione. Imprenditore pugliese dell'anno!"
      : win.name+" chiude con "+eur(net(win))+". Nessun milione… per ora!")+"</span>"));
  var b=el("button","btn btn-gold mt","🔄 Nuova partita");
  b.onclick=function(){ newGame(); render(); };
  root.appendChild(b);
  root.appendChild(el("div","hint","Grazie per aver giocato all'Edizione Puglia 🌊"));
}

function sparkline(vals){
  var w=64,h=24,pad=2;
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), rng=Math.max(1,mx-mn);
  var pts=vals.map(function(v,i){
    var x=pad+i*(w-2*pad)/(vals.length-1||1);
    var y=h-pad-((v-mn)/rng)*(h-2*pad);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  var col=vals[vals.length-1]>=vals[0]?"#4ade80":"#f87171";
  return "<svg width='"+w+"' height='"+h+"' viewBox='0 0 "+w+" "+h+"'><polyline fill='none' stroke='"+col+"' stroke-width='2' stroke-linejoin='round' stroke-linecap='round' points='"+pts+"'/></svg>";
}

// ════════════════ BOOT ════════════════
newGame();
render();
</script>
